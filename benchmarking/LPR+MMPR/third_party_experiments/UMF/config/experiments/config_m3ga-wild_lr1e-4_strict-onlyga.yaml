DEFAULT:
  num_points: 50000
  use_rgb: True
  use_cloud: True
  dataset: "M3GAWild"
  dataset_folder: /datasets/work/d61-cps-slam/source/M3GA-Wild

TRAIN:
  num_workers: 16
  train_step: 'single_step' # single_step, multistaged
  optimizer: "AdamW"
  scheduler:  "CosineAnnealingLR" # MultiStepLR OneCycleLR  CosineAnnealingLR  LinearWarmupCosineAnnealingLR
  batch_size: 32 # 64
  val_batch_size: 160 # 256
  batch_size_limit: 160 # 2048
  batch_expansion_rate: 1.4
  batch_expansion_th: 0.5
  only_ground_aerial: True
  lr: 1e-4
  image_lr: 1e-4
  epochs: 200
  scheduler_milestones: [10, 30, 60]
  aug_mode: 1
  normalize_points: True
  weight_decay: 5e-4
  warmup_epochs: 5
  loss: MultiBatchHardTripletLossWithMasksAugmented
  weights: [0.5, 0.5, 0.1]
  normalize_embeddings: True
  margin: 0.2
  train_file: training_queries_M3GAWild-aerial_baseline_ground-aerial-only_v4.pickle
  val_file: test_queries_M3GAWild-aerial_v4.pickle
