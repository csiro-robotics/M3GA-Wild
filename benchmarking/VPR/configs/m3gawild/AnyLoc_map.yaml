# TRAINING 
num_gpus: 1
seed: 2024 

max_epochs: 40
warmup_epochs: 10
milestones: [10,20]
lr: 0.0001
lr_mul: 0.1
weight_decay: 0.0001
loss: multi_similarity_loss
validation: False

# DATA
dataset: M3GA-Wild
m3gawild_path: ''
data_folder: images_shrunk
pos_include_radius: 5.0
pos_exclude_radius: 0.0
fov_include_radius: 10.0
buffer_radius: 30.0
eval_pos_radius: 30.0
only_ground_aerial: False

train_img_size: [224, 224]
val_img_size: [336, 336]
centre_crop: False

img_per_place: 4
batch_size: 128
num_workers: 16
anchor_framerate_downsample: 5
aerial_spatial_downsample: 1

# MODEL 
model_name: AnyLoc 
domain: map
