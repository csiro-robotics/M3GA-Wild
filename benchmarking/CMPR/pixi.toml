[workspace]
authors = ["Griffiths, Ethan (Data61, Pullenvale) <ethan.griffiths@data61.csiro.au>"]
channels = ['conda-forge']
name = "M3GAWild-CMPR"
platforms = [
  { platform = "linux-64", cuda = "12.0" },
]
version = "0.1.0"

[tasks]

[activation]
scripts = ["env-setup.sh"]

[pypi-options]
no-build-isolation = ["dwconv"]

[dependencies]
python = ">=3.10,<3.11"
faiss = ">=1.9,<2.0"
matplotlib = ">=3.10,<3.11"
numpy = ">=1.26,<2.0"
opencv = ">=4.11.0,<4.12.0"
pandas = ">=2.3,<2.4"
pillow = ">=11.3,<11.4"
pyyaml = ">=6.0,<6.1"
timm = ">=1.0,<1.1"
rich = ">=14.0,<15.0"
pytorch-gpu = ">=2.7,<2.8"
cuda-version = "12.9.*"
torchvision = ">=0.22,<0.23"
gcc_linux-64 = ">14.0,<15.0"
gxx_linux-64 = ">14.0,<15.0"
cuda-toolkit = "12.9.*"

[pypi-dependencies]
albumentations = ">=1.3.0,<1.4.0"
lightning = ">=2.5,<2.6"
ocnn = "==2.2.2"
pytorch-lightning = ">=2.5,<2.6"
pytorch-metric-learning = ">=2.9,<2.10"
scikit-image = ">=0.25.0,<0.26.0"
scikit-learn = ">=1.7.0,<1.8.0"
scipy = ">=1.15.0,<1.16.0"
shapely = ">=2.1.0,<2.2.0"
torchpack = ">=0.3.0,<0.4.0"
tqdm = ">=4.67.0"
umap-learn = ">=0.5.0,<0.6.0"
wandb = ">=0.21.0,<0.22.0"
dwconv = { path = "./libs/dwconv" }
easydict = ">=1.14, <2"
